
#########################
# Special Workspace
#########################
bind = SUPER, o, exec, ~/.config/hypr/scripts/obsidian-toggle.sh daily
bind = SUPER SHIFT, o, exec, ~/.config/hypr/scripts/obsidian-toggle.sh vault

workspace = special:obsidian, on-created-empty:xdg-open "obsidian://daily?vault=grizzlyweb"

windowrule {
  name = obsidian-scratch
  match:class = ^(obsidian)$

  workspace = special:obsidian
  float = on
  center = on
  size = (monitor_w*0.75) (monitor_h*0.90)
  opacity = 0.95
}


bind = SUPER, G, togglespecialworkspace, gaming
