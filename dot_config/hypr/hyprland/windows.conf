# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule {
  name = windowrule-1
  suppress_event = maximize
  opacity = 1 1
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


windowrule {
  name = windowrule-3
  no_screen_share = on
  match:class = ^(1Password)$
}


######
# Browser types
######

windowrule {
  name = windowrule-4
  tag = +chromium-based-browser
  match:class = ([cC]hrom(e|ium)|[bB]rave-browser|Microsoft-edge|Vivaldi-stable)
}

windowrule {
  name = windowrule-5
  tag = +firefox-based-browser
  match:class = ([fF]irefox|zen|librewolf)
}


# Force chromium-based browsers into a tile to deal with --app bug
windowrule {
  name = windowrule-6
  tile = on
  opacity = 1
  match:tag = chromium-based-browser
}


# Only a subtle opacity change, but not for video sites
#windowrule = opacity 1 0.97, tag:firefox-based-browser

# Some video sites should never have opacity applied to them
windowrule {
  name = windowrule-7
  opacity = 1.0 1.0
  match:initial_title = ((?i)(?:[a-z0-9-]+\.)*youtube\.com_/|app\.zoom\.us_/wc/home)
}


######
# hyprshot
######

# Remove 1px border around hyprshot screenshots
layerrule {
  name = layerrule-1
  no_anim = on
  match:namespace = selection
}



#######
# Jetbrains
#######
# Fixing popup size issue
windowrule {
  name = windowrule-8
  size = (monitor_w*0.5) (monitor_h*0.5)
  match:class = (.*jetbrains.*)$
  match:title = ^$
  match:float = 1
}


# Fix tab dragging (always have a single space character as their title)
windowrule {
  name = windowrule-9
  no_initial_focus = on
  no_focus = on
  match:class = ^(.*jetbrains.*)$
  match:title = ^\\s$
}



#######
# Localsend
#######

# Float LocalSend and fzf file picker
windowrule {
  name = windowrule-10
  float = on
  center = on
  match:class = (Share|localsend)
}



######
# Picture-in-picture overlays
######

#windowrule = tag +pip, title:(Picture.{0,1}in.{0,1}[Pp]icture)
windowrule {
  name = windowrule-11
  float = on
  pin = on
  size = 600 338
  keep_aspect_ratio = on
  border_size = 0
  opacity = 1 1
  move = ((monitor_w*1)-window_w-40) ((monitor_h*0.04))
  match:tag = pip
}


######
# RetroArch
######

windowrule {
  name = windowrule-12
  fullscreen = on
  opacity = 1 1
  idle_inhibit = fullscreen
  match:class = com.libretro.RetroArch
}



######
# Steam
######

windowrule {
  name = windowrule-13
  float = on
  opacity = 1 1
  idle_inhibit = fullscreen
  match:class = steam
}

windowrule {
  name = windowrule-14
  center = on
  size = 1100 700
  match:class = steam
  match:title = Steam
}

windowrule {
  name = windowrule-15
  size = 460 800
  match:class = steam
  match:title = Friends List
}

windowrule = immediate, class:^(noita.exe)$

# Gaming: Steam Proton / Steam native games
# ─── Windowrules für Steam Games ──────────────────────────────
# Alle Spiele, die von Steam gestartet werden (class = steam_app_*)
windowrule {
  name = windowrule-16
  workspace = special:gaming
  fullscreen = on
  match:class = ^(steam_app_.*)$
}




######
# Floating windows
######

windowrule {
  name = windowrule-17
  float = on
  center = on
  size = 800 600
  match:tag = floating-window
}


windowrule {
  name = windowrule-18
  tag = +floating-window
  match:class = (blueberry.py|Impala|Wiremix|org.gnome.NautilusPreviewer|com.gabm.satty|Omarchy|About|TUI.float)
}

windowrule {
  name = windowrule-19
  tag = +floating-window
  match:class = (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus)
  match:title = ^(Open.*Files?|Open Folder|Save.*Files?|Save.*As|Save|All Files)
}


# Fullscreen screensaver
windowrule {
  name = windowrule-20
  fullscreen = on
  match:class = Screensaver
}


# No transparency on media windows
windowrule {
  name = windowrule-21
  opacity = 1 1
  match:class = ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$
}


######
# Terminals
######

# Define terminal tag to style them uniformly
windowrule {
  name = windowrule-22
  tag = +terminal
  match:class = (Alacritty|kitty|com.mitchellh.ghostty)
}



